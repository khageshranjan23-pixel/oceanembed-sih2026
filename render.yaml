services:
  - type: web
    name: oceanembed-sih2026
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node scripts/serve.mjs
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: UPSTREAM_API_BASE
        value: https://oceanembed-api-4m85.onrender.com
      - key: PORT
        value: 10000
    healthCheckPath: /health